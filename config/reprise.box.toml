# Box settings for Reprise. Inline values only. Each secret names a source
# and never carries a value. The Vertex key is a file at mode 0600, so its
# reference names the path and the value is the file's contents.
transcription_model = "universal-3.5-pro"
editorial_model = "gemini-3.8-flash"
cover_model = "gemini-3.1-flash-image"
session_max_seconds = 1800
guest_max_sessions = 1000
guest_max_episodes = 10
daily_spend_cents = 100000
render_concurrency = 1
data_dir = "/var/lib/reprise/data"
media_dir = "/var/lib/reprise/media"
vertex_project = "nryn-personal"
vertex_location = "global"
public_origin = "https://reprise.nryn.dev"
# The sending address for sign-in mail. Resend needs the domain verified
# with its SPF and DKIM records before any mail is delivered.
mail_from = "Reprise <reprise@send.nryn.dev>"
# Replies go here when set. Empty means replies to sign-in mail go nowhere.
mail_reply_to = ""
# The OAuth client for Google sign-in. It stays empty until Google sign-in
# is configured, and the route refuses while it is empty.
google_client_id = ""
# Identities that hold the operator role. Each entry reads email:<address>
# or google:<sub>. Empty means nobody holds the role.
operators = []

[secrets.assemblyai_api_key]
source = "env_file"
path = "/etc/reprise/env"
var = "ASSEMBLYAI_API_KEY"

[secrets.gemini_credential]
source = "file"
path = "/etc/reprise/gemini-sa.json"

[secrets.session_signing_key]
source = "env_file"
path = "/etc/reprise/env"
var = "SESSION_SIGNING_KEY"

[secrets.resend_api_key]
source = "env_file"
path = "/etc/reprise/env"
var = "RESEND_API_KEY"

[secrets.google_client_secret]
source = "env_file"
path = "/etc/reprise/env"
var = "GOOGLE_CLIENT_SECRET"

[secrets.login_code_key]
source = "env_file"
path = "/etc/reprise/env"
var = "LOGIN_CODE_KEY"
