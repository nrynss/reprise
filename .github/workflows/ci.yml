name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      # The same digest the image carries, so the media checks measure with
      # one build everywhere. The release archive this once used is gone
      # upstream, so the binaries come out of the image instead.
      - name: Install pinned ffmpeg and ffprobe
        run: |
          cid=$(docker create mwader/static-ffmpeg:9.0.1@sha256:54e55b0cb8f672870fc38ceb2e6c411855cb3b39c505f5f3b2505ee01ed5f2b7)
          docker cp "${cid}:/ffmpeg" /usr/local/bin/ffmpeg
          docker cp "${cid}:/ffprobe" /usr/local/bin/ffprobe
          docker rm "${cid}"
          ffmpeg -version | head -1

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # Playwright needs its own browser builds.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: web

      - name: Run the gate
        run: ./tools/check.sh
