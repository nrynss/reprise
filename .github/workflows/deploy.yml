# Deploy a published image to the Hetzner box.
#
# Triggered after a successful image publish, or by hand. The box never
# logs into the registry. The runner pulls the image and loads it over SSH.
# Secrets on the box stay on the box.
name: deploy

on:
  workflow_run:
    workflows: ["image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Image reference, tag or digest'
        required: false
        type: string
      sha:
        description: 'Expected commit SHA for the health check'
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Download metadata from image workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: image-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/image-metadata

      - name: Determine deployment image and SHA
        id: deploy-meta
        run: |
          TARGET_IMAGE=""
          EXPECTED_SHA=""

          if [[ -f /tmp/image-metadata/image-ref.txt && -s /tmp/image-metadata/image-ref.txt ]]; then
            TARGET_IMAGE="$(cat /tmp/image-metadata/image-ref.txt)"
            EXPECTED_SHA="$(cat /tmp/image-metadata/sha.txt)"
            echo "Resolved target from workflow artifact: ${TARGET_IMAGE}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"
            SHORT_SHA="${EXPECTED_SHA:0:7}"
            TARGET_IMAGE="ghcr.io/${{ github.repository }}:${SHORT_SHA}"
            echo "Resolved target from workflow_run SHA: ${TARGET_IMAGE}"
          elif [[ -n "${{ inputs.image_ref }}" ]]; then
            TARGET_IMAGE="${{ inputs.image_ref }}"
            EXPECTED_SHA="${{ inputs.sha }}"
            echo "Resolved target from workflow_dispatch input: ${TARGET_IMAGE}"
          else
            TARGET_IMAGE="ghcr.io/${{ github.repository }}:latest"
            EXPECTED_SHA="${{ inputs.sha }}"
            echo "Defaulting target image to latest: ${TARGET_IMAGE}"
          fi

          echo "target_image=${TARGET_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "expected_sha=${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on the runner
        run: docker pull "${{ steps.deploy-meta.outputs.target_image }}"

      - name: Deploy to production box
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET_IMAGE: ${{ steps.deploy-meta.outputs.target_image }}
          EXPECTED_SHA: ${{ steps.deploy-meta.outputs.expected_sha }}
        run: |
          # redeploy.sh runs through `tee` below. Without pipefail the step
          # takes tee's exit code, so a refused deploy reports success and
          # the box keeps serving nothing.
          set -o pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          DEPLOY_TARGET="${DEPLOY_HOST}"
          if [[ "${DEPLOY_TARGET}" != *"@"* ]]; then
            DEPLOY_TARGET="root@${DEPLOY_TARGET}"
          fi

          SSH=(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30)
          SCP=(scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes)

          echo "Ensuring /srv/reprise/deploy exists..."
          "${SSH[@]}" "${DEPLOY_TARGET}" "mkdir -p /srv/reprise/deploy /srv/reprise/data /srv/reprise/media && chown -R 65532:65532 /srv/reprise"

          # The secret files are mode 0600, so only their owner reads them,
          # and the container is uid 65532 rather than root. Created by root
          # they mount fine and the process then crash-loops on "permission
          # denied". Converge the ownership the same way the data directory
          # above is converged. Nothing here reads a value.
          echo "Ensuring the secret files are readable by uid 65532..."
          "${SSH[@]}" "${DEPLOY_TARGET}" "for f in /etc/reprise/env /etc/reprise/gemini-sa.json; do [ -e \"\$f\" ] && chown 65532:65532 \"\$f\" && echo \"  owned by 65532: \$f\"; done; true"

          echo "Shipping deploy scripts..."
          "${SCP[@]}" deploy/run.sh deploy/redeploy.sh deploy/backup.sh "${DEPLOY_TARGET}:/srv/reprise/deploy/"
          "${SSH[@]}" "${DEPLOY_TARGET}" "chmod 0755 /srv/reprise/deploy/run.sh /srv/reprise/deploy/redeploy.sh /srv/reprise/deploy/backup.sh"

          echo "Loading image onto the box..."
          docker save "${TARGET_IMAGE}" | gzip | "${SSH[@]}" "${DEPLOY_TARGET}" "gunzip | docker load"

          echo "Executing /srv/reprise/deploy/redeploy.sh on the box..."
          "${SSH[@]}" "${DEPLOY_TARGET}" "/srv/reprise/deploy/redeploy.sh '${TARGET_IMAGE}' '${EXPECTED_SHA}'" | tee /tmp/deploy_out.log

      - name: Deployment Summary
        if: always()
        run: |
          TARGET_IMAGE="${{ steps.deploy-meta.outputs.target_image }}"
          EXPECTED_SHA="${{ steps.deploy-meta.outputs.expected_sha }}"

          echo "### Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Image:** \`${TARGET_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${EXPECTED_SHA}" ]]; then
            echo "- **Expected Commit SHA:** \`${EXPECTED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f /tmp/deploy_out.log ]]; then
            if grep -qi "Deployment successful" /tmp/deploy_out.log; then
              echo "- **Status:** Success" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              sed -n '/Deployment successful/,$p' /tmp/deploy_out.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **Status:** Failed" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 25 /tmp/deploy_out.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- **Status:** Deployment did not produce a log" >> "$GITHUB_STEP_SUMMARY"
          fi
