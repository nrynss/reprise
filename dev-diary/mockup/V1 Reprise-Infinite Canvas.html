<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reprise — Design Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #14100C;
    --bg-subtle: #1A1611;
    --surface: #1F1A14;
    --surface-raised: #262019;
    --border: rgba(242,234,217,0.07);
    --border-hover: rgba(242,234,217,0.15);
    --accent: #E8A33D;
    --accent-dim: rgba(232,163,61,0.14);
    --text: #F2EAD9;
    --text-secondary: rgba(242,234,217,0.62);
    --text-tertiary: rgba(242,234,217,0.34);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-serif: "Instrument Serif", Georgia, serif;
    --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;
    --note-bg: #241D15;
    --note-border: rgba(232,163,61,0.2);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  .canvas-viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; --grid-color: rgba(242,234,217,0.045); }
  .canvas-viewport.panning { cursor: grabbing; }
  .canvas-world { position: absolute; left: 0; top: 0; width: 20000px; height: 20000px; transform-origin: 0 0; will-change: transform; }

  .canvas-el { position: absolute; cursor: grab; transition: box-shadow var(--transition-normal), transform var(--transition-fast); }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging { cursor: grabbing; z-index: 999; box-shadow: var(--shadow-drag) !important; transform: scale(1.01); transition: none; }

  .section-header { position: absolute; pointer-events: none; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .section-header .section-num { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--accent); opacity: 0.8; }
  .section-header .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); }
  .section-header .section-line { flex: none; width: 48px; height: 1px; background: linear-gradient(90deg, var(--accent) 0%, transparent 100%); opacity: 0.3; }

  .canvas-title { position: absolute; pointer-events: none; font-weight: 700; line-height: 1.1; letter-spacing: -0.025em; color: var(--text); }
  .canvas-text { position: absolute; line-height: 1.7; letter-spacing: 0.005em; color: var(--text-secondary); min-width: 200px; max-width: 560px; white-space: pre-wrap; word-break: break-word; }

  .canvas-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 100px; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); white-space: nowrap; transition: border-color var(--transition-fast), background var(--transition-fast); }
  .canvas-tag:hover { border-color: var(--border-hover); background: var(--surface-raised); }
  .canvas-tag .tag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .context-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; min-width: 220px; transition: border-color var(--transition-normal), box-shadow var(--transition-normal); }
  .context-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .context-card .card-head { padding: 16px 20px 12px; display: flex; align-items: center; gap: 10px; }
  .context-card .card-head .head-indicator { width: 3px; height: 16px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .context-card .card-head h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--text); }
  .context-card .card-content { padding: 0 20px 20px; font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
  .context-card .card-content ul { list-style: none; padding: 0; }
  .context-card .card-content li { padding: 4px 0; padding-left: 12px; position: relative; }
  .context-card .card-content li::before { content: ''; position: absolute; left: 0; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-tertiary); }

  .ds-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; transition: border-color var(--transition-normal), box-shadow var(--transition-normal); }
  .ds-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .ds-card .ds-head { padding: 16px 20px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); }
  .ds-card .ds-body { padding: 0 20px 20px; }

  .color-swatch-group { display: flex; flex-direction: row; flex-wrap: wrap; gap: 18px; }
  .swatch-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .swatch-circle { width: 52px; height: 52px; border-radius: 50%; box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.06); transition: transform var(--transition-fast), box-shadow var(--transition-fast); }
  .swatch-circle:hover { transform: scale(1.1); box-shadow: var(--shadow-md); }
  .swatch-name { font-size: 10px; font-weight: 500; color: var(--text-secondary); text-align: center; }
  .swatch-hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); text-align: center; }

  .type-sample-group { display: flex; flex-direction: column; gap: 18px; min-width: 380px; }
  .type-sample-row { display: flex; align-items: baseline; gap: 18px; }
  .type-sample-meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); min-width: 52px; flex-shrink: 0; letter-spacing: 0.04em; }
  .type-sample-text { color: var(--text); line-height: 1.25; }

  .canvas-note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: var(--radius-md); padding: 16px 18px; min-width: 200px; max-width: 300px; box-shadow: var(--shadow-sm); transition: box-shadow var(--transition-normal), transform var(--transition-fast); }
  .canvas-note:hover { box-shadow: var(--shadow-md); }
  .canvas-note .note-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); opacity: 0.75; margin-bottom: 8px; }
  .canvas-note .note-body { font-size: 13px; line-height: 1.65; color: var(--text-secondary); }

  .design-page { background: #fff; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-lg); transition: box-shadow var(--transition-normal); }
  .design-page:hover { box-shadow: 0 16px 56px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35); }
  .design-page .page-content { width: 100%; height: 100%; overflow: hidden; }
  .page-label { position: absolute; bottom: -32px; left: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: var(--text-tertiary); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .page-label .label-num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); opacity: 0.6; }

  .canvas-diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .canvas-diagram .diagram-content { width: 100%; height: 100%; padding: 20px; }

  .group-label { position: absolute; pointer-events: none; font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); opacity: 0.75; white-space: nowrap; }
  .flow-arrow { position: absolute; pointer-events: none; display: flex; align-items: center; gap: 6px; }
  .flow-arrow::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(232,163,61,0.12), rgba(232,163,61,0.5)); }
  .flow-arrow::after { content: ''; width: 0; height: 0; border-left: 6px solid rgba(232,163,61,0.6); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }

  .zoom-controls { position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 1px; z-index: 100; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
  .zoom-btn { width: 36px; height: 36px; background: transparent; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--transition-fast), color var(--transition-fast); }
  .zoom-btn:hover { background: rgba(242,234,217,0.06); color: var(--text); }
  .zoom-label { min-width: 50px; height: 36px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .coord-indicator { position: fixed; bottom: 28px; left: 24px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-tertiary); z-index: 100; padding: 4px 10px; background: rgba(20,16,12,0.85); border: 1px solid var(--border); border-radius: var(--radius-sm); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .kbd-hint { position: fixed; top: 20px; right: 24px; z-index: 100; font-size: 10px; color: var(--text-tertiary); display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd { font-family: var(--font-mono); padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; }

  /* ═══ product page styles (Row 3) ═══ */
  .pg { width: 100%; height: 100%; background: #17130F; color: #F2EAD9; font-family: var(--font-sans); font-size: 12.5px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
  .pg-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #8C8375; }
  .pg-serif { font-family: var(--font-serif); font-weight: 400; }
  .pg-dim { color: #A89C89; }
  .pg-faint { color: #7A7264; }
  .pg-card { background: #201A13; border: 1px solid rgba(242,234,217,0.09); border-radius: 12px; padding: 12px 14px; }
  .pg-card-2 { background: #2A221A; border: 1px solid rgba(242,234,217,0.12); border-radius: 12px; padding: 12px 14px; }
  .pg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 8px 18px; border-radius: 10px; font-size: 12.5px; font-weight: 600; }
  .pg-btn-amber { background: #E8A33D; color: #1A140D; }
  .pg-btn-line { border: 1px solid rgba(242,234,217,0.18); color: #F2EAD9; }
  .pg-btn-quiet { color: #A89C89; }
  .pg-chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid rgba(242,234,217,0.12); border-radius: 100px; padding: 3px 9px; color: #A89C89; }
  .pg-chip i { width: 5px; height: 5px; border-radius: 50%; background: #7A7264; }
  .pg-chip.live { color: #E88A78; border-color: rgba(217,84,63,0.4); }
  .pg-chip.live i { background: #D9543F; }
  .pg-chip.ok { color: #A9C294; border-color: rgba(143,168,116,0.35); }
  .pg-chip.ok i { background: #8FA874; }
  .pg-chip.amber { color: #E8A33D; border-color: rgba(232,163,61,0.4); }
  .pg-chip.amber i { background: #E8A33D; }
  .pg-wave { display: flex; align-items: flex-end; gap: 2px; height: 30px; }
  .pg-wave i { flex: 1; border-radius: 1px; background: rgba(242,234,217,0.16); height: calc(14% + var(--h) * 86%); }
  .pg-wave i.on { background: rgba(232,163,61,0.75); }
  .pg-vu { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
  .pg-vu i { width: 4px; border-radius: 2px; background: #E8A33D; opacity: .85; height: calc(14% + var(--h) * 86%); }
  .pg-vu.host i { background: #A5714B; opacity: .7; }
  .pg-topbar { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid rgba(242,234,217,0.07); }
  .pg-brand { font-family: var(--font-serif); font-size: 18px; }
  .pg-nav { display: flex; gap: 10px; margin-left: 6px; }
  .pg-nav span { font-size: 11px; color: #A89C89; }
  .pg-nav span.cur { color: #F2EAD9; }
  .pg-cover { width: 100%; aspect-ratio: 1; border-radius: 10px; background: #241C13; border: 1px solid rgba(242,234,217,0.1); display: flex; flex-direction: column; justify-content: space-between; padding: 10%; }
  .pg-cover .n { font-family: var(--font-serif); font-size: 30px; line-height: .95; }
  .pg-cover .mw { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
  .pg-cover .mw i { flex: 1; border-radius: 1px; background: rgba(242,234,217,0.35); height: calc(20% + var(--h) * 80%); }
  .pg-turn { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(242,234,217,0.06); }
  .pg-turn .r { font-family: var(--font-mono); font-size: 8px; letter-spacing: .12em; color: #7A7264; width: 30px; flex: none; padding-top: 3px; }
  .pg-turn.host .r { color: #E8A33D; }
  .pg-turn p { margin: 0; color: #A89C89; font-size: 12px; line-height: 1.65; }
  .pg-turn.host p { color: #F2EAD9; }
  .pg-cut { text-decoration: line-through; text-decoration-color: rgba(198,91,78,.7); background: rgba(198,91,78,.14); border-radius: 3px; padding: 0 2px; }
  .pg-prog { height: 4px; border-radius: 100px; background: rgba(242,234,217,0.1); overflow: hidden; }
  .pg-prog i { display: block; height: 100%; background: #E8A33D; border-radius: 100px; }
  .pg-step { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(242,234,217,0.06); align-items: flex-start; }
  .pg-step .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(242,234,217,0.18); flex: none; margin-top: 1px; }
  .pg-step.done .dot { border-color: rgba(143,168,116,.5); background: rgba(143,168,116,.14); }
  .pg-step.run .dot { border-color: rgba(232,163,61,.5); background: rgba(232,163,61,.14); }
  .pg-step h4 { margin: 0; font-size: 12px; font-weight: 600; }
  .pg-step p { margin: 2px 0 0; font-size: 10.5px; color: #7A7264; }
  .pg-mic { width: 96px; height: 96px; border-radius: 50%; background: #2A221A; border: 1px solid rgba(242,234,217,0.14); display: grid; place-items: center; color: #E8A33D; margin: 0 auto; }
  .pg-mic.big { width: 130px; height: 130px; }
  .pg-mic svg { width: 34px; height: 34px; stroke: currentColor; stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .pg-grid { display: grid; gap: 12px; }
  .pg-kv { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(242,234,217,0.06); }
  .pg-kv:last-child { border-bottom: none; }
  .pg-switch { width: 40px; height: 23px; border-radius: 100px; background: #D9543F; position: relative; flex: none; }
  .pg-switch::after { content: ''; position: absolute; top: 2.5px; right: 2.5px; width: 18px; height: 18px; border-radius: 50%; background: #F2EAD9; }
  .pg-switch.off { background: rgba(242,234,217,0.14); }
  .pg-switch.off::after { right: auto; left: 2.5px; }
  .pg-quote { border-left: 2px solid rgba(232,163,61,0.4); background: rgba(232,163,61,0.06); border-radius: 0 10px 10px 0; padding: 10px 12px; }
  .pg-quote p { margin: 0; color: #F2EAD9; font-family: var(--font-serif); font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
  <button class="zoom-btn" id="zoomReset" title="Reset view" aria-label="Reset view">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>

<div class="kbd-hint" id="kbdHint"></div>

<script>
(() => {
'use strict';

const UI_STRINGS = {
  docTitle: 'Reprise — Design Canvas',
  zoom: { zoomIn: 'Zoom in', zoomOut: 'Zoom out', reset: 'Reset view' },
  kbdHints: [['Scroll', 'pan'], ['⌘Scroll', 'zoom'], ['⌘Z', 'undo']],
  sections: { context: '01 PROJECT CONTEXT', designSystem: '02 DESIGN SYSTEM', deliverables: '03 DESIGN DELIVERABLES' },
};

document.title = UI_STRINGS.docTitle;
document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
document.getElementById('zoomReset').title = UI_STRINGS.zoom.reset;
document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints.map(([k, a]) => `<span><kbd>${k}</kbd> ${a}</span>`).join('');

const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const zoomLabel = document.getElementById('zoomLabel');
const coordIndicator = document.getElementById('coordIndicator');

let panX = 0, panY = 0, zoom = 1;
const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

function updateTransform() {
  world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  zoomLabel.textContent = Math.round(zoom * 100) + '%';
  updateGrid();
}
function updateGrid() {
  const g = 40 * zoom;
  viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
  viewport.style.backgroundSize = `${g}px ${g}px`;
  viewport.style.backgroundPosition = `${panX % g}px ${panY % g}px`;
}

let isPanning = false, panSX, panSY;
viewport.addEventListener('pointerdown', e => {
  if (e.target === viewport || e.target === world) {
    isPanning = true;
    panSX = e.clientX - panX; panSY = e.clientY - panY;
    viewport.classList.add('panning');
    viewport.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
});
viewport.addEventListener('pointermove', e => {
  if (!isPanning) return;
  panX = e.clientX - panSX; panY = e.clientY - panSY;
  updateTransform();
});
viewport.addEventListener('pointerup', () => { isPanning = false; viewport.classList.remove('panning'); });

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) {
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
    const factor = e.deltaY > 0 ? 0.95 : 1.05;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = mx - wx * zoom; panY = my - wy * zoom;
  } else {
    const hasX = Math.abs(e.deltaX) > 0.5;
    if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
      panX -= e.deltaX; panY -= e.deltaY;
    } else {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom; panY = my - wy * zoom;
    }
  }
  updateTransform();
}, { passive: false });

function zoomAt(factor) {
  const r = viewport.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
  zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
  panX = cx - wx * zoom; panY = cy - wy * zoom;
  updateTransform();
}
document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 60; panY = 40; updateTransform(); };

viewport.addEventListener('pointermove', e => {
  if (isPanning) return;
  const r = viewport.getBoundingClientRect();
  coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
});

let lastPinchDist = null, lastPinchCenter = null;
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    e.preventDefault();
  }
}, { passive: false });
viewport.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const t0 = e.touches[0], t1 = e.touches[1];
  const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
  if (lastPinchDist > 0) {
    const r = viewport.getBoundingClientRect();
    const mx = center.x - r.left, my = center.y - r.top;
    const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
    panX = mx - wx * zoom; panY = my - wy * zoom;
  }
  if (lastPinchCenter) { panX += center.x - lastPinchCenter.x; panY += center.y - lastPinchCenter.y; }
  lastPinchDist = dist; lastPinchCenter = center;
  updateTransform();
}, { passive: false });
viewport.addEventListener('touchend', e => { if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; } });

const undoStack = [];
function saveUndo() {
  const s = [];
  world.querySelectorAll('.canvas-el').forEach(el => s.push({ id: el.id, left: el.style.left, top: el.style.top }));
  undoStack.push({ panX, panY, zoom, assets: s });
  if (undoStack.length > 60) undoStack.shift();
}
function undo() {
  if (!undoStack.length) return;
  const st = undoStack.pop();
  panX = st.panX; panY = st.panY; zoom = st.zoom;
  st.assets.forEach(a => { const el = document.getElementById(a.id); if (el) { el.style.left = a.left; el.style.top = a.top; } });
  updateTransform();
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
});

function makeDraggable(el) {
  let dragging = false, sx, sy, ox, oy;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    dragging = true;
    el.classList.add('dragging');
    saveUndo();
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
    el.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
    el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
  });
  el.addEventListener('pointerup', () => { if (dragging) { dragging = false; el.classList.remove('dragging'); } });
}

function below(el, gap) { return parseFloat(el.style.top) + el.offsetHeight + (gap === undefined ? 20 : gap); }

const bars = (n, seed) => {
  let s = '';
  for (let i = 0; i < n; i++) {
    const h = Math.abs(Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453) % 1;
    s += '<i style="--h:' + (0.08 + h * 0.92).toFixed(2) + '"></i>';
  }
  return s;
};
const wave = (n, seed, onFrac) => {
  let s = '';
  const k = Math.round(n * (onFrac || 0));
  for (let i = 0; i < n; i++) {
    const h = Math.abs(Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453) % 1;
    s += '<i class="' + (i < k ? 'on' : '') + '" style="--h:' + (0.08 + h * 0.92).toFixed(2) + '"></i>';
  }
  return s;
};
const vuBars = n => {
  let s = '';
  for (let i = 0; i < n; i++) s += '<i style="--h:' + (0.25 + Math.abs(Math.sin(i * 3.7)) * 0.75).toFixed(2) + '"></i>';
  return s;
};
